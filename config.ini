[workspace]
# Workspace root path - should be on non-C drive for Windows
# For Linux/Unix, any path with sufficient space
root_path = /data/fdroid_workspace
validate_non_c_drive = false

[scheduler]
# Hours between metadata fetches from F-Droid
fetch_metadata_interval_hours = 24
# Hours between build cycles
build_interval_hours = 6
# Hours between repository updates
update_repos_interval_hours = 12
# Hours between new repository clones
clone_repos_interval_hours = 6
# Day of week for cleanup (0=Monday, 6=Sunday)
cleanup_day_of_week = 6
# Hour of day for cleanup (0-23)
cleanup_hour = 2
# Hour of day for database backup (0-23)
backup_hour = 3

[build]
# Maximum number of concurrent builds
max_concurrent_builds = 3
# Timeout for single build in minutes
build_timeout_minutes = 30
# Maximum consecutive failures before abandoning app
max_consecutive_failures = 3
# Maximum memory for Gradle JVM in GB
gradle_memory_gb = 4
# Maximum metaspace for Gradle JVM in MB
gradle_metaspace_mb = 512

[cleanup]
# Maximum size for single repository in GB
max_repo_size_gb = 5
# Days of inactivity before considering app inactive
inactive_days = 90
# Days to keep Gradle cache files
gradle_cache_retention_days = 30
# Maximum total workspace size in GB
max_workspace_size_gb = 200
# Disk usage percentage threshold for emergency cleanup
emergency_cleanup_threshold = 95
# Disk usage percentage threshold for warnings
warning_cleanup_threshold = 85

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
# Maximum log file size in MB before rotation
max_log_file_mb = 50
# Number of rotated log files to keep
log_backup_count = 10
# Use JSON format for structured logging
json_format = true

[health_check]
# Enable HTTP server for health checks
enable_http_server = true
# Port for health check server
http_port = 8080
# Host binding for health check server
http_host = 0.0.0.0

[fdroid]
# F-Droid index URL
index_url = https://f-droid.org/repo/index-v1.json
# Backup mirror URL (optional)
mirror_url = 
# Maximum apps to process per metadata fetch (0 = unlimited)
max_apps_to_process = 0
# Only process apps with Git repositories
git_only = true

[git]
# Git clone timeout in seconds
clone_timeout = 600
# Git fetch timeout in seconds
fetch_timeout = 300
# Use shallow clone (--depth=1)
shallow_clone = true
# Maximum retry attempts for git operations
max_retries = 3

[java]
# Paths to different Java versions (optional, will auto-detect if not set)
